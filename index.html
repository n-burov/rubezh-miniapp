<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Рубеж — Настройки</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #0f1620);
            color: var(--tg-theme-text-color, #ffffff);
            padding: 16px;
            min-height: 100vh;
        }
        .container { max-width: 480px; margin: 0 auto; }
        h1 { font-size: 22px; margin-bottom: 8px; }
        .subtitle { font-size: 14px; opacity: 0.6; margin-bottom: 24px; }
        
        .section {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .section-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
        
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .toggle-row:last-child { border-bottom: none; }
        .toggle-label { font-size: 15px; }
        
        .switch {
            position: relative;
            width: 48px;
            height: 28px;
            flex-shrink: 0;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #444;
            transition: .3s;
            border-radius: 28px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #dc2626; }
        input:checked + .slider:before { transform: translateX(20px); }
        
        .severity-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .severity-btn {
            flex: 1;
            min-width: 40px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: .2s;
        }
        .severity-btn.active {
            background: #dc2626;
            border-color: #dc2626;
        }
        
        .save-btn {
            width: 100%;
            padding: 16px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
        }
        .save-btn:active { opacity: 0.8; }
        
        .status {
            text-align: center;
            padding: 12px;
            font-size: 14px;
            opacity: 0.6;
        }
        .status.success { color: #22c55e; opacity: 1; }
        .status.error { color: #dc2626; opacity: 1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡 Рубеж</h1>
        <p class="subtitle">Настройте уведомления под себя</p>
        
        <div id="loading" class="status">Загрузка...</div>
        
        <div id="app" style="display: none;">
            <div class="section">
                <div class="toggle-row">
                    <span class="toggle-label">🔔 Уведомления</span>
                    <label class="switch">
                        <input type="checkbox" id="enabled" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            
            <div class="section">
                <div class="section-title">📍 Регионы</div>
                <div id="regions"></div>
            </div>
            
            <div class="section">
                <div class="section-title">🎯 Типы угроз</div>
                <div id="threats"></div>
            </div>
            
            <div class="section">
                <div class="section-title">📊 Минимальная серьёзность</div>
                <div class="severity-row" id="severity"></div>
            </div>
            
            <button class="save-btn" id="saveBtn">Сохранить</button>
            <div id="status" class="status"></div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://max.ru/js/max-web-app.js"></script>
    <script src="app.js"></script>
</body>
</html>
